name: Build requested proposals
on:
  schedule:
    - cron: "*/10 13-23 * * 1-5"   # every 10 min, about 7am-6pm Mountain, weekdays
    - cron: "*/10 0 * * 2-6"
  workflow_dispatch:
    inputs:
      groups:
        description: "Build these desk groups now (comma-separated names), whatever their status"
        required: false
        default: ""
concurrency:
  group: proposals
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check for work first (fast exit)
        id: check
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ github.event.inputs.groups }}
        run: |
          if [ -n "$FORCE" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          r=$(curl -s "https://uwcciwmsjzaslxhykyqc.supabase.co/rest/v1/groups?select=id&proposal_status=eq.requested" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          n=$(echo "$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d) if isinstance(d,list) else 'ERR')" 2>/dev/null || echo ERR)
          if [ "$n" = "ERR" ]; then echo "::error::Supabase refused the service role key (check the SUPABASE_SERVICE_ROLE_KEY secret)"; exit 1; fi
          echo "::notice::requests waiting: $n"; if [ "$n" != "0" ]; then echo "go=1" >> $GITHUB_OUTPUT; fi
      - name: Install LibreOffice, poppler, Python packages
        if: steps.check.outputs.go == '1'
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends libreoffice-calc poppler-utils >/dev/null || { echo "::error::apt install of LibreOffice failed"; exit 1; }
          pip install -q openpyxl reportlab pdfplumber pillow || { echo "::error::pip install failed"; exit 1; }
      - name: Warm up LibreOffice
        if: steps.check.outputs.go == '1'
        timeout-minutes: 4
        run: timeout 180 soffice --headless --terminate_after_init || true
      - name: Build
        if: steps.check.outputs.go == '1'
        timeout-minutes: 15
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_GROUPS: ${{ github.event.inputs.groups }}
        run: python3 builder/run.py
